<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/chat.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.0/bundles/stomp.umd.min.js"></script>

    <script defer src="/js/websocket.js"></script>
    <script defer src="/js/chat.js"></script>
    <script defer src="/js/privateChats.js"></script>
</head>

<body>

<div class="chat-header">
    <span id="chatTitle">Public Chat</span>

    <button id="chatRequestBtn"
            class="chat-request-btn"
            onclick="window.location.href='/requests'">
        ➕ Chat Requests
    </button>
</div>


<div class="app-container">

    <aside class="sidebar">
        <div class="sidebar-header">Chats</div>

        <button id="publicBtn" class="sidebar-btn active">🌍 Public Chat</button>
        <button id="privateBtn" class="sidebar-btn">🔒 Private Chat</button>

        <div class="sidebar-section">Private Chats</div>
        <div id="privateChatList" class="private-list">
            <div class="empty-state">Start messaging</div>
        </div>
    </aside>

    <main class="chat-area">
        <div class="chat-header">
            <span id="chatTitle">Public Chat</span>
        </div>

        <div id="chat" class="chat-body"></div>
        <div id="typing"></div>

        <div class="chat-footer">
            <input id="messageInput" placeholder="Type a message">
            <button id="sendBtn">Send</button>
        </div>
    </main>

</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        window.chatMode = "PUBLIC";
        connectWebSocket();
    });
</script>

</body>
</html>
