<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Requests</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .page-container {
            max-width: 700px;
            margin: 40px auto;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: none;
        }

        .card-header {
            font-weight: 600;
            background: #0d6efd;
            color: #fff;
            border-radius: 10px 10px 0 0;
        }

        .request-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .username {
            font-weight: 500;
        }

        .status {
            font-size: 13px;
            color: #6c757d;
        }

        .btn-sm {
            padding: 4px 10px;
        }

        .back-link {
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="page-container">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Chat Requests</h4>
        <a href="/chat" class="back-link">← Back to Chat</a>
    </div>

    <!-- SEND REQUEST -->
    <div class="card mb-4">
        <div class="card-header">
            Send Chat Request
        </div>
        <div class="card-body">
            <div class="input-group">
                <input id="usernameInput" class="form-control" placeholder="Enter username">
                <button class="btn btn-primary" onclick="sendRequest()">Send</button>
            </div>
        </div>
    </div>

    <!-- INCOMING REQUESTS -->
    <div class="card mb-4">
        <div class="card-header">
            Incoming Requests
        </div>
        <div class="card-body">
            <div id="incomingRequests" class="list-group">
                <div class="text-muted">No incoming requests</div>
            </div>
        </div>
    </div>

    <!-- SENT REQUESTS -->
    <div class="card">
        <div class="card-header">
            Sent Requests
        </div>
        <div class="card-body">
            <div id="sentRequests" class="list-group">
                <div class="text-muted">No sent requests</div>
            </div>
        </div>
    </div>

</div>

<!-- JS -->
<script src="/js/requests.js"></script>

</body>
</html>
