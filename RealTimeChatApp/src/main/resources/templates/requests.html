<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Chat Requests</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="/css/chat.css">
</head>

<body>

<div class="app">


    <!-- ================= LEFT ICON BAR ================= -->
    <aside class="icon-bar">

        <div class="icon-bar-top">
            <div class="avatar">
                <img src="/images/user.png" alt="User" />
            </div>
        </div>

        <div class="icon-bar-center">
            <button class="icon-btn" onclick="location.href='/chat'">
                <i class="ri-earth-line"></i>
            </button>

            <button class="icon-btn active">
                <i class="ri-user-add-line"></i>
            </button>
        </div>

        <div class="icon-bar-bottom">
            <button class="icon-btn">
                <i class="ri-settings-3-line"></i>
            </button>
        </div>

    </aside>

    <!-- ================= REQUEST PAGE CONTENT ================= -->
    <main style="flex:1; overflow-y:auto;">

        <div class="requests-page">

            <!-- Header -->
            <header class="requests-header">
                <h1>Chat Requests</h1>
                <a href="/chat" class="back-link">← Back to Chat</a>
            </header>

            <!-- ================= SEND REQUEST ================= -->
            <section class="request-card">
                <h3>Send Chat Request</h3>

                <div class="request-input">
                    <input 
                        type="text" 
                        placeholder="Enter username..." 
                        id="requestUsername"
                    >
                    <button id="sendRequestBtn">
                        Send
                    </button>
                </div>
            </section>

            <!-- ================= INCOMING REQUESTS ================= -->
            <section class="request-card">
                <h3>Incoming Requests</h3>

                <div id="incomingList" class="request-list">
                    <!-- Example (JS will render real data) -->
                    <!--
                    <div class="request-item">
                        <span class="request-user">username</span>

                        <div class="request-actions">
                            <button class="btn-accept">Accept</button>
                            <button class="btn-decline">Decline</button>
                        </div>
                    </div>
                    -->
                </div>
            </section>

            <!-- ================= SENT REQUESTS ================= -->
            <section class="request-card">
                <h3>Sent Requests</h3>

                <div id="sentList" class="request-list">
                    <!-- Example -->
                    <!--
                    <div class="request-item">
                        <span class="request-user">username</span>
                        <span class="pending-badge">Pending</span>
                    </div>
                    -->
                </div>
            </section>

        </div>

    </main>

</div>

<!-- Optional JS -->
<script src="/js/requests.js"></script>

</body>
</html>
